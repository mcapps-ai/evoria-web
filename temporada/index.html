      '<h2 id="dlg-title">' + esc(p.nombre) + '</h2>' +
      (p.aroma ? '<p class="eyebrow" style="letter-spacing:.14em">Aroma: ' + esc(p.aroma) + '</p>' : '') +
      (p.descripcion ? '<p class="desc">' + esc(p.descripcion) + '</p>' : '') +
      '<p class="price">' + (p.precio != null ? gs(p.precio) : '<span style="font-family:var(--sans);font-size:1rem;color:var(--ink-2)">Consultar precio</span>') + '</p>' +
      '<p class="avail">' + AV[p.disponibilidad] + '</p>' +
      '<div class="actions"><a class="wa-btn" href="' + waHref(p) + '" target="_blank" rel="noopener" data-wa="' + p.id + '">' + WA_ICON + (p.disponibilidad === 'agotado' ? 'Avisarme cuando vuelva' : 'Pedir por WhatsApp') + '</a>' +
      '<button class="share" type="button" data-share="' + p.id + '">Compartir este producto</button></div></div></div>';
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open','');
    history.replaceState(null, '', '?p=' + p.id);
    track('view_item', { item_id: p.id, item_name: p.nombre });
    var sl = $('slides');
    sl.addEventListener('scroll', function(){
      var i = Math.round(sl.scrollLeft / sl.clientWidth);
      dlg.querySelectorAll('.dots button').forEach(function(b, j){ b.setAttribute('aria-current', j === i); });
    }, { passive:true });
  }
  function closeDlg(){ var d = $('dlg'); if (d.open) d.close(); }
  $('dlg').addEventListener('close', function(){ history.replaceState(null, '', location.pathname); });
  $('dlg').addEventListener('click', function(e){
    if (e.target === this || e.target.closest('[data-close]')) return closeDlg();
    var d = e.target.closest('.dots button');
    if (d){ var sl = $('slides'); sl.scrollTo({ left: sl.clientWidth * +d.dataset.i, behavior:'smooth' }); }
    var s = e.target.closest('[data-share]');
    if (s){
      var p = all.find(function(x){ return x.id === s.dataset.share; });
      var url = link(p);
      track('share', { item_id: p.id, item_name: p.nombre });
      if (navigator.share) navigator.share({ title: 'Evoria: ' + p.nombre, url: url }).catch(function(){});
      else if (navigator.clipboard) navigator.clipboard.writeText(url).then(function(){ toast('Enlace copiado'); });
    }
  });

  function toast(t){ var el = $('toast'); el.textContent = t; el.classList.add('show'); setTimeout(function(){ el.classList.remove('show'); }, 1800); }

  document.addEventListener('click', function(e){
    var w = e.target.closest('[data-wa]');
    if (w){ var p = all.find(function(x){ return x.id === w.dataset.wa; }); track('whatsapp_click', { origen: SEASON ? 'Temporada: ' + SEASON.nombre : 'Catálogo', producto: p ? p.nombre : '' }); e.stopPropagation(); return; }
    if (e.target.closest('#waFloat')){ track('whatsapp_click', { origen: 'Catálogo: botón flotante' }); return; }
    var c = e.target.closest('.chip');
    if (c){ cat = c.dataset.cat; chips(); render(); return; }
    var k = e.target.closest('.card');
    if (k) open(k.dataset.id);
  }, true);
  document.addEventListener('keydown', function(e){
    var k = e.target.closest && e.target.closest('.card');
    if (k && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); open(k.dataset.id); }
  });
  $('shareCat').addEventListener('click', function(){
    track('share', { item_id: 'catalogo' });
    if (navigator.share) navigator.share({ title: SEASON ? 'Evoria: ' + SEASON.nombre : 'Catálogo Evoria', url: PAGE }).catch(function(){});
    else if (navigator.clipboard) navigator.clipboard.writeText(PAGE).then(function(){ toast('Enlace copiado'); });
  });
  $('q').addEventListener('input', function(){ q = this.value; render(); });

  var ORN = {
    navidad:'<svg class="orn" viewBox="0 0 64 64" fill="none" stroke="#e2c48f" stroke-width="1.6" stroke-linecap="round"><path d="M32 6v52M9.5 19l45 26M9.5 45l45-26"/><path d="M27 10l5 5 5-5M27 54l5-5 5 5M10 25l7 0-3 6M54 39l-7 0 3-6M10 39l7 0-3-6M54 25l-7 0 3 6"/></svg>',
    enamorados:'<svg class="orn" viewBox="0 0 64 64"><path d="M32 54S8 40 8 24a12 12 0 0 1 24-4 12 12 0 0 1 24 4c0 16-24 30-24 30z" fill="none" stroke="#e2c48f" stroke-width="1.8"/></svg>',
    madre:'<svg class="orn" viewBox="0 0 64 64" fill="none" stroke="#b56a78" stroke-width="1.6"><circle cx="32" cy="32" r="5"/><ellipse cx="32" cy="18" rx="6" ry="10"/><ellipse cx="32" cy="46" rx="6" ry="10"/><ellipse cx="18" cy="32" rx="10" ry="6"/><ellipse cx="46" cy="32" rx="10" ry="6"/></svg>',
    primavera:'<svg class="orn" viewBox="0 0 64 64" fill="none" stroke="#5f7a45" stroke-width="1.6"><path d="M32 58V24"/><path d="M32 36c-10 0-16-8-16-16 10 0 16 8 16 16zM32 30c8 0 14-6 14-14-8 0-14 6-14 14z"/></svg>',
    padre:'<svg class="orn" viewBox="0 0 64 64" fill="none" stroke="#e2c48f" stroke-width="1.6"><path d="M14 22h36l-4 30H18z"/><path d="M22 22c0-6 4-10 10-10s10 4 10 10"/></svg>'
  };
  function fx(tema){
    var cv = $('fx'), ctx = cv.getContext && cv.getContext('2d');
    if (!ctx || matchMedia('(prefers-reduced-motion: reduce)').matches || ['navidad','enamorados','madre','primavera'].indexOf(tema) < 0) return;
    var box = $('intro'), W, H, dpr = Math.min(2, devicePixelRatio || 1), parts = [];
    function size(){ W = box.clientWidth; H = box.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
    size(); addEventListener('resize', size);
    var n = Math.round(Math.min(46, W / 14));
    function mk(top){ return { x: Math.random() * W, y: top ? -10 : Math.random() * H, r: 2 + Math.random() * (tema === 'navidad' ? 2.6 : 5), v: .25 + Math.random() * .55, d: Math.random() * 6.28, o: .35 + Math.random() * .5, g: Math.random() < .3 }; }
    for (var i = 0; i < n; i++) parts.push(mk(false));
    function heart(x, y, r){ ctx.beginPath(); ctx.moveTo(x, y + r * .35); ctx.bezierCurveTo(x - r, y - r * .5, x - r * .35, y - r * 1.15, x, y - r * .45); ctx.bezierCurveTo(x + r * .35, y - r * 1.15, x + r, y - r * .5, x, y + r * .35); ctx.fill(); }
    (function tick(){
      ctx.clearRect(0, 0, W, H);
      parts.forEach(function(p, i){
        p.y += p.v; p.d += .01; p.x += Math.sin(p.d) * .35;
        if (p.y > H + 10) parts[i] = mk(true);
        ctx.globalAlpha = p.o;
        if (tema === 'navidad'){ ctx.fillStyle = p.g ? '#e2c48f' : '#ffffff'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28); ctx.fill(); }
        else if (tema === 'enamorados'){ ctx.fillStyle = p.g ? '#e2c48f' : '#f6c9d3'; heart(p.x, p.y, p.r * 1.6); }
        else { ctx.fillStyle = tema === 'madre' ? (p.g ? '#d89aa6' : '#f2b8c3') : (p.g ? '#a9c08a' : '#f3d9a2'); ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r, p.r * .55, p.d, 0, 6.28); ctx.fill(); }
      });
      ctx.globalAlpha = 1; requestAnimationFrame(tick);
    })();
  }

  function loadSeason(){
    if (!TEMP) return Promise.resolve(null);
    return fetch(SB_URL + '/rest/v1/temporada?select=activa,nombre,titulo,mensaje,tema&id=eq.1', { headers: hdr })
      .then(function(r){ return r.ok ? r.json() : []; }).then(function(rows){ return rows[0] || null; });
  }
  var params = new URLSearchParams(location.search), hdr = { apikey: SB_KEY }, filtro = '&publicado=eq.true';
  var preview = false;
  if (params.get('preview') === '1'){
    try{
      var tok = JSON.parse(localStorage.getItem('sb-tpmsauhfxqplyakthgiz-auth-token') || 'null');
      if (tok && tok.access_token){ hdr.Authorization = 'Bearer ' + tok.access_token; preview = true; if (params.get('p')) filtro = '&id=eq.' + encodeURIComponent(params.get('p')); }
    }catch(e){}
  }
  loadSeason().then(function(t){
    if (TEMP){
      if (!t || (!t.activa && !preview)){
        $('iEyebrow').textContent = 'Temporada';
        $('iTitle').textContent = 'Próximamente';
        $('iLead').textContent = 'Estamos preparando la próxima colección especial. Mientras tanto, conocé todo el catálogo.';
        $('shareCat').classList.add('hidden'); document.querySelector('.tools').style.display = 'none';
        $('grid').innerHTML = '<div class="season-off" style="grid-column:1/-1"><a href="../catalogo/">Ver el catálogo completo</a></div>';
        $('count').textContent = '';
        return null;
      }
      SEASON = t;
      document.body.setAttribute('data-tema', t.tema);
      document.title = 'Evoria | ' + t.nombre;
      $('iEyebrow').textContent = (preview && !t.activa ? 'Vista previa · ' : '') + 'Catálogo de ' + t.nombre;
      $('iTitle').textContent = t.titulo || t.nombre;
      $('iLead').textContent = t.mensaje || '';
      if (ORN[t.tema]) $('iEyebrow').insertAdjacentHTML('beforebegin', ORN[t.tema]);
      $('waFloat').href = 'https://wa.me/' + WA + '?text=' + encodeURIComponent('Hola Evoria, quisiera consultar por el catálogo de ' + t.nombre + '.');
      if (!params.get('p') || !preview) filtro = '&publicado=eq.true&en_temporada=eq.true';
      fx(t.tema);
    }
    return fetch(SB_URL + '/rest/v1/productos?select=id,nombre,descripcion,categoria,aroma,precio,disponibilidad,destacado,orden,fotos' + filtro + '&order=destacado.desc,orden.asc,nombre.asc', { headers: hdr })
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(rows){
        all = rows;
        chips(); render();
        var id = params.get('p');
        if (preview && !TEMP) $('iEyebrow').textContent = 'Vista previa (solo para Evoria)';
        if (id) open(id);
      });
  }).catch(function(){
    $('grid').innerHTML = '<div class="state" style="grid-column:1/-1">No pudimos cargar el catálogo en este momento. <a href="https://wa.me/' + WA + '" target="_blank" rel="noopener">Escribinos por WhatsApp</a> y te pasamos las opciones.</div>';
    $('count').textContent = '';
  });
})();
</script>
